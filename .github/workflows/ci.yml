name: Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, and Test Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: nulis_bareng_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Database Migrations
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/nulis_bareng_test?schema=public"
        run: npx prisma migrate deploy

      - name: 1. Run Linter
        run: npm run lint

      - name: 2. Run TypeScript Typecheck
        run: npm run typecheck

      - name: 3. Run Automated Tests & Coverage
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/nulis_bareng_test?schema=public"
          REDIS_URL: "redis://localhost:6379"
          ENABLE_REDIS: "false"
          NODE_ENV: "test"
        run: npm run test:coverage

      - name: 4. Production Build Check
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/nulis_bareng_test?schema=public"
          REDIS_URL: "redis://localhost:6379"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
